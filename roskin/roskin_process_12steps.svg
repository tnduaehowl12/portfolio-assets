<text x="72" y="56" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#E05F9F" letter-spacing="2">PROCESS</text>
<text x="44" y="104" font-family="Noto Sans CJK KR" font-size="40" font-weight="700" fill="#16242F">12단계 제조 공정 순서도</text>
<text x="44" y="140" font-family="Noto Sans CJK KR" font-size="20" fill="#6E7684">주문 1건 = 1 사이클 · 키오스크 주문을 받아 1번부터 12번까지 순서대로 실행</text>
