<text x="950.0" y="898" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">컵 파지 → 스쿱 파지 → 힘 감지 진입 → 스쿠핑 → 배출 → 스쿱 반납 → 서빙 → 복귀</text>
