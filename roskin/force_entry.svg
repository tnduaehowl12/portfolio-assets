<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1470" viewBox="0 0 1720 1470">
<rect width="1720" height="1470" fill="#FFFFFF"/>
<defs>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E05F9F"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#075DAA"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E7684"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B07A16"/></marker>
</defs>
<circle cx="78" cy="50" r="9" fill="#E05F9F"/>
<text x="98" y="56" font-family="Noto Sans CJK KR" font-size="19" font-weight="700" fill="#E05F9F" letter-spacing="2">FORCE SENSING</text>
<text x="70" y="106" font-family="Noto Sans CJK KR" font-size="40" font-weight="700" fill="#16242F">힘 감지 진입 판정</text>
<text x="70" y="144" font-family="Noto Sans CJK KR" font-size="20" fill="#6E7684">기준값 측정 → 2mm씩 하강 → 변화량 계산 → 연속 2회 충족 시 접촉 확정</text>
<rect x="70" y="196" width="540" height="84" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.8"/>
<text x="92" y="238" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#16242F">진입 시작 자세 도달</text>
<text x="92" y="268" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">통 위 안전 높이 · 틸트 자세 고정</text>
<line x1="340.0" y1="280" x2="340.0" y2="312" stroke="#075DAA" stroke-width="3" marker-end="url(#ab)"/>
<rect x="70" y="320" width="540" height="108" rx="14" fill="#FCEEF5" stroke="#E05F9F" stroke-width="3"/>
<rect x="92" y="336" width="56" height="26" rx="6" fill="#E05F9F"/>
<text x="120" y="355" font-family="Noto Sans CJK KR" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">①</text>
<text x="92" y="388" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#C93F82">기준값(baseline) 측정</text>
<text x="92" y="418" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">그 자리에서 Fx, Fz를 한 번 기록 — 이후 비교의 원점</text>
<line x1="340.0" y1="428" x2="340.0" y2="464" stroke="#075DAA" stroke-width="3" marker-end="url(#ab)"/>
<rect x="70" y="472" width="540" height="84" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.8"/>
<text x="92" y="514" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#16242F">Z축 2mm 하강</text>
<text x="92" y="544" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">movel · 베이스 좌표계 기준 수직 이동</text>
<line x1="340.0" y1="556" x2="340.0" y2="588" stroke="#075DAA" stroke-width="3" marker-end="url(#ab)"/>
<rect x="70" y="596" width="540" height="108" rx="14" fill="#FCEEF5" stroke="#E05F9F" stroke-width="3"/>
<rect x="92" y="612" width="56" height="26" rx="6" fill="#E05F9F"/>
<text x="120" y="631" font-family="Noto Sans CJK KR" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">②</text>
<text x="92" y="664" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#C93F82">변화량 Δ 계산</text>
<text x="92" y="694" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">Δ = √( (Fx − baseFx)² + (Fz − baseFz)² )</text>
<line x1="340.0" y1="704" x2="340.0" y2="740" stroke="#075DAA" stroke-width="3" marker-end="url(#ab)"/>
<rect x="70" y="748" width="540" height="120" rx="14" fill="#E9F1FA" stroke="#075DAA" stroke-width="2"/>
<rect x="92" y="764" width="56" height="26" rx="6" fill="#075DAA"/>
<text x="120" y="783" font-family="Noto Sans CJK KR" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">③</text>
<text x="92" y="816" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#075DAA">Δ ≥ 40N ?</text>
<text x="92" y="846" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">비상정지 한계 — 스쿠핑 전 구간에서 상시 검사</text>
<line x1="616" y1="808.0" x2="682" y2="808.0" stroke="#C93F82" stroke-width="2.6" marker-end="url(#ap)"/>
<rect x="690" y="748" width="380" height="120" rx="13" fill="#FCEEF5" stroke="#C93F82" stroke-width="1.8"/>
<text x="712" y="784" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#C93F82">비상정지</text>
<text x="712" y="812" font-family="Noto Sans CJK KR" font-size="16" fill="#6E7684">즉시 중단 · 배출과 서빙 금지</text>
<line x1="340.0" y1="868" x2="340.0" y2="894" stroke="#075DAA" stroke-width="3" marker-end="url(#ab)"/>
<text x="354.0" y="891.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="700" fill="#075DAA">아니오</text>
<rect x="70" y="902" width="540" height="120" rx="14" fill="#E9F1FA" stroke="#075DAA" stroke-width="2"/>
<rect x="92" y="918" width="56" height="26" rx="6" fill="#075DAA"/>
<text x="120" y="937" font-family="Noto Sans CJK KR" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">④</text>
<text x="92" y="970" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#075DAA">Δ ≥ 1.3N ?</text>
<text x="92" y="1000" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">접촉 임계값</text>
<line x1="616" y1="962.0" x2="682" y2="962.0" stroke="#6E7684" stroke-width="2.6" marker-end="url(#ag)"/>
<rect x="690" y="902" width="380" height="120" rx="13" fill="#FFFFFF" stroke="#6E7684" stroke-width="1.8"/>
<text x="712" y="938" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#6E7684">hit = 0</text>
<text x="712" y="966" font-family="Noto Sans CJK KR" font-size="16" fill="#6E7684">노이즈로 판단 · 카운터 초기화</text>
<line x1="340.0" y1="1022" x2="340.0" y2="1048" stroke="#075DAA" stroke-width="3" marker-end="url(#ab)"/>
<text x="354.0" y="1045.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="700" fill="#075DAA">예 · hit += 1</text>
<rect x="70" y="1056" width="540" height="120" rx="14" fill="#E9F1FA" stroke="#075DAA" stroke-width="2"/>
<rect x="92" y="1072" width="56" height="26" rx="6" fill="#075DAA"/>
<text x="120" y="1091" font-family="Noto Sans CJK KR" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">⑤</text>
<text x="92" y="1124" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#075DAA">hit ≥ 2 ?</text>
<text x="92" y="1154" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">연속 2회 충족 여부</text>
<line x1="616" y1="1116.0" x2="682" y2="1116.0" stroke="#B07A16" stroke-width="2.6" marker-end="url(#aa)"/>
<rect x="690" y="1056" width="380" height="120" rx="13" fill="#FDF4E3" stroke="#B07A16" stroke-width="1.8"/>
<text x="712" y="1092" font-family="Noto Sans CJK KR" font-size="20" font-weight="700" fill="#B07A16">하한 Z 도달 ?</text>
<text x="712" y="1120" font-family="Noto Sans CJK KR" font-size="16" fill="#6E7684">도달 시 감지 실패로 중단</text>
<line x1="340.0" y1="1176" x2="340.0" y2="1240" stroke="#E05F9F" stroke-width="3" marker-end="url(#ap)"/>
<text x="354.0" y="1218.0" font-family="Noto Sans CJK KR" font-size="16" font-weight="700" fill="#E05F9F">예</text>
<rect x="70" y="1248" width="540" height="104" rx="14" fill="#FCEEF5" stroke="#E05F9F" stroke-width="3"/>
<rect x="92" y="1264" width="56" height="26" rx="6" fill="#E05F9F"/>
<text x="120" y="1283" font-family="Noto Sans CJK KR" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">⑥</text>
<text x="92" y="1316" font-family="Noto Sans CJK KR" font-size="24" font-weight="700" fill="#C93F82">접촉 확정 — found_z 기록</text>
<text x="92" y="1346" font-family="Noto Sans CJK KR" font-size="17" fill="#6E7684">이 깊이를 기준으로 스쿠핑 커얼 동작 시작</text>
<path d="M 880.0 1182 L 880.0 1222" fill="none" stroke="#6E7684" stroke-width="2.6" stroke-dasharray="9 6"/>
<path d="M 1076 962.0 L 1106 962.0 L 1106 1222" fill="none" stroke="#6E7684" stroke-width="2.6" stroke-dasharray="9 6"/>
<path d="M 1106 1222 L 40 1222 L 40 514.0 L 62 514.0" fill="none" stroke="#6E7684" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#ag)"/>
<text x="56" y="1206" font-family="Noto Sans CJK KR" font-size="16.5" font-weight="700" fill="#6E7684">아니오 — 다시 2mm 하강</text>
<rect x="1140" y="196" width="540" height="176" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.8"/>
<rect x="1140" y="196" width="6" height="176" rx="3" fill="#E05F9F"/>
<text x="1168" y="236" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16242F">왜 절대값이 아니라 변화량인가</text>
<text x="1168" y="272" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">진입 자세는 손목이 기울어져 있어,</text>
<text x="1168" y="299" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">허공에 떠 있어도 Fz가 −10 ~ −15N으로 잡힌다.</text>
<text x="1168" y="326" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">절대값으로는 접촉 여부를 구분할 수 없으므로</text>
<text x="1168" y="353" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">기준값 대비 증가분만 판정에 사용한다.</text>
<rect x="1140" y="396" width="540" height="150" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.8"/>
<rect x="1140" y="396" width="6" height="150" rx="3" fill="#075DAA"/>
<text x="1168" y="436" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16242F">왜 연속 2회인가</text>
<text x="1168" y="472" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">센서 노이즈는 한 스텝만 튀고 사라지지만,</text>
<text x="1168" y="499" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">실제 접촉이면 다음 스텝에도 값이 유지된다.</text>
<text x="1168" y="526" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">한 번의 스파이크로 진입을 확정하지 않는다.</text>
<rect x="1140" y="570" width="540" height="150" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.8"/>
<rect x="1140" y="570" width="6" height="150" rx="3" fill="#075DAA"/>
<text x="1168" y="610" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16242F">힘 측정 기준 좌표계</text>
<text x="1168" y="646" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">get_tool_force(ref=DR_BASE) — 베이스 기준.</text>
<text x="1168" y="673" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">진입이 베이스 Z축 수직 하강이므로</text>
<text x="1168" y="700" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">접촉 반력이 해당 축에 그대로 실린다.</text>
<rect x="1140" y="744" width="540" height="230" rx="14" fill="#063A6B"/>
<text x="1168" y="788" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#E05F9F">임계값</text>
<text x="1168" y="838" font-family="Noto Sans CJK KR" font-size="30" font-weight="700" fill="#FFFFFF">1.3N</text>
<text x="1290" y="822" font-family="Noto Sans CJK KR" font-size="15" fill="#8FA9C6">변화량</text>
<text x="1290" y="844" font-family="Noto Sans CJK KR" font-size="16.5" fill="#FFFFFF">접촉으로 판정 (연속 2회)</text>
<text x="1168" y="906" font-family="Noto Sans CJK KR" font-size="30" font-weight="700" fill="#FFFFFF">40N</text>
<text x="1290" y="890" font-family="Noto Sans CJK KR" font-size="15" fill="#8FA9C6">변화량</text>
<text x="1290" y="912" font-family="Noto Sans CJK KR" font-size="16.5" fill="#FFFFFF">비상정지 — 스쿠핑 전 구간</text>
<rect x="1140" y="1056" width="540" height="150" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.8"/>
<rect x="1140" y="1056" width="6" height="150" rx="3" fill="#E05F9F"/>
<text x="1168" y="1096" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#16242F">실측 결과</text>
<text x="1168" y="1132" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">저속(50%) · 정속(100%) 모두 동일 깊이에서 감지.</text>
<text x="1168" y="1159" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">커얼 구간 최대 힘 약 −18.6N —</text>
<text x="1168" y="1186" font-family="Noto Sans CJK KR" font-size="16.5" fill="#6E7684">비상정지 한계 40N 대비 절반 이하 여유.</text>
<rect x="70" y="1394" width="1580" height="54" rx="12" fill="#063A6B"/>
<text x="860.0" y="1428" font-family="Noto Sans CJK KR" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">고정 깊이가 아니라, 매 사이클 힘으로 표면을 다시 찾는다</text>
</svg>